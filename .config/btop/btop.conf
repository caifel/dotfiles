# btop config for the Linux Docker workstation.
# Keep this container-friendly: no macOS/Homebrew theme paths, battery, or host sensor assumptions.

color_theme = "Default"
theme_background = False
truecolor = True
force_tty = False

presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"
shown_boxes = "cpu mem net proc"
update_ms = 2000

vim_keys = True
rounded_corners = True
graph_symbol = "braille"
graph_symbol_cpu = "default"
graph_symbol_mem = "default"
graph_symbol_net = "default"
graph_symbol_proc = "default"

proc_sorting = "memory"
proc_reversed = False
proc_tree = True
proc_colors = True
proc_gradient = True
proc_per_core = False
proc_mem_bytes = True
proc_cpu_graphs = True
proc_info_smaps = False
proc_left = False
proc_filter_kernel = True
proc_aggregate = False

cpu_graph_upper = "Auto"
cpu_graph_lower = "Auto"
cpu_invert_lower = True
cpu_single_graph = False
cpu_bottom = True
show_uptime = True
check_temp = False
show_coretemp = False
temp_scale = "celsius"
base_10_sizes = False
show_cpu_freq = True
custom_cpu_name = ""

clock_format = "%H:%M:%S"
background_update = True

mem_graphs = True
mem_below_net = False
show_swap = True
swap_disk = False
show_disks = True
only_physical = False
use_fstab = False
disks_filter = ""
zfs_hide_datasets = False
disk_free_priv = False
show_io_stat = True
io_mode = False
io_graph_combined = False
io_graph_speeds = ""

net_download = 100
net_upload = 100
net_auto = True
net_sync = True
net_iface = ""

show_battery = False
selected_battery = "Auto"
show_battery_watts = False

log_level = "WARNING"
